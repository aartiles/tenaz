name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Architecture
        run: scripts/check-architecture.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The CLI end-to-end test (crates/cli/tests/cli.rs) runs the fake
      # harness through a whole run and takes about two minutes. The macOS
      # memory probe test is ignored off macOS (cfg_attr in probe_macos.rs),
      # so it only runs on the macos-14 job.
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
