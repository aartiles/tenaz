# Crates are covered by Dependabot security updates and cargo-deny in
# advisories.yml; this only keeps the workflows' actions current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Its version is the minimum Rust that ci.yml checks, set by
    # rust-version in Cargo.toml, not a release to keep current.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    # dist generates release.yml and its plan job fails when the file
    # differs from what dist would write. Its actions change with
    # cargo-dist-version in dist-workspace.toml and `dist init`.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]
