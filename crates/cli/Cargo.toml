[package]
name = "smr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Single-model runner: plans, builds and verifies a goal with one resident local model at a time."

[[bin]]
name = "smr"
path = "src/main.rs"

[dependencies]
smr-core = { workspace = true, features = ["testing"] }
smr-adapters.workspace = true
smr-proxy.workspace = true
smr-acp.workspace = true
smr-pi.workspace = true
smr-mcp.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
