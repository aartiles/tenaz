name: CI

# CI ran on every push and on every pull request, so a push to a branch
# with a pull request started two runs, each with a macos-14 job. Several
# macos-14 jobs ended cancelled after 15 minutes with no runner and no
# steps (pull request #14; main on 2026-10-28, where no other CI macOS job
# was queued ahead of it), so the cause is not known. Pushes now run CI
# only on main and on v* tags, pull requests on their own event, and a
# newer push to a pull request cancels the older run. Any branch can be
# run by hand from the Actions tab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One group per pull request (`refs/pull/N/merge`); every other run has a
# group of its own, so a push to main is never queued behind or cancelled
# by another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Architecture
        run: scripts/check-architecture.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The CLI end-to-end test (crates/cli/tests/cli.rs) runs the fake
      # harness through a whole run and takes about two minutes. The macOS
      # memory probe test is ignored off macOS (cfg_attr in probe_macos.rs),
      # so it only runs on the macos-14 job.
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
