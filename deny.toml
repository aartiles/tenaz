# cargo-deny configuration: `cargo deny check`.
# The project is MIT OR Apache-2.0; dependencies must be under a license that
# is compatible with shipping under either.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
# Permissive licenses only. Each entry beyond MIT and Apache-2.0 is required
# by at least one crate in Cargo.lock (see `cargo deny list -l license`).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[advisories]
# Each entry says why it is ignored. Remove it when the advisory is withdrawn,
# the crate is fixed or maintained again, or no crate in Cargo.lock needs it.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained but has no known vulnerability; rmcp 3.9 (locked) and 3.11 (latest) depend on it directly, not as an option, so no feature or upgrade drops it" },
]
