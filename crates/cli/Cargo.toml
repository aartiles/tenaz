[package]
name = "tenaz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drives a local model through a coding agent until the goal passes its checks."

# The workspace does not publish to crates.io, but dist ships this binary.
[package.metadata.dist]
dist = true

[[bin]]
name = "tenaz"
path = "src/main.rs"

[dependencies]
tenaz-core = { workspace = true, features = ["testing"] }
tenaz-adapters.workspace = true
tenaz-proxy.workspace = true
tenaz-acp.workspace = true
tenaz-pi.workspace = true
tenaz-mcp.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
reqwest.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
